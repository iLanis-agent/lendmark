<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lendmark - where's your drill? someone knows.</title>
<style>
  :root { --bg:#12161a; --panel:#182028; --line:#2b3d4a; --text:#eef4f8; --dim:#8fa5b5; --accent:#f2a65a; --over:#ff8f7a; --soon:#ffcf7a; --ok:#8be0a4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(640px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  input, select { background:#0d1216; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; }
  label { color:var(--dim); font-size:11px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#12161a; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .item { background:#0d1216; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px; display:flex; align-items:center; gap:12px; }
  .item .info { flex:1; }
  .item .nm { font-weight:700; font-size:14px; }
  .item .meta { color:var(--dim); font-size:12px; margin-top:3px; }
  .item .meta b { color:var(--text); font-weight:600; }
  .chip { font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; white-space:nowrap; }
  .c-overdue { background:var(--over); color:#12161a; }
  .c-due-soon { background:var(--soon); color:#12161a; }
  .c-fine { background:#1e3a4d; color:var(--ok); }
  .back-btn { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .back-btn:hover { background:var(--accent); color:#12161a; }
  .del { background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; padding:4px; }
  .del:hover { color:var(--over); }
  .borrower { display:flex; align-items:center; gap:10px; background:#0d1216; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:6px; }
  .borrower .nm { font-weight:700; flex:1; }
  .borrower .meta { color:var(--dim); font-size:12px; }
  .score { font-size:18px; font-weight:900; }
  .empty { color:var(--dim); text-align:center; padding:10px 0; font-size:14px; }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>Lendmark</h1>
<div class="sub">your drill has been gone four months and nobody remembers where. lend things with a memory.</div>

<div class="card">
  <h2>Lend something</h2>
  <div class="row">
    <div><label>Item</label><input id="i-name" placeholder="e.g. Cordless drill"></div>
    <div><label>To</label><input id="i-borrower" placeholder="e.g. Yoni"></div>
    <div><label>Lent on</label><input id="i-date" type="date"></div>
    <div><label>Expected back</label><select id="i-days"><option value="3">3 days</option><option value="7" selected>a week</option><option value="14">2 weeks</option><option value="30">a month</option></select></div>
    <button id="add">Lend it</button>
  </div>
</div>

<div class="card">
  <h2>Out right now</h2>
  <div id="items"><div class="empty">Nothing out. Your garage is whole.</div></div>
</div>

<div class="card">
  <h2>Borrower trust</h2>
  <div id="borrowers"><div class="empty">No borrowers yet.</div></div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'lendmark-v1';
  var items = [];

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) items = s; } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var LABEL = { overdue: 'overdue', 'due-soon': 'due soon', fine: 'out' };

  function renderItems() {
    var el = document.getElementById('items');
    var open = Lendmark.sortOpen(items, todayISO());
    if (!open.length) { el.innerHTML = '<div class="empty">Nothing out. Your garage is whole.</div>'; return; }
    el.innerHTML = '';
    open.forEach(function (s) {
      var it = s.item;
      var div = document.createElement('div');
      div.className = 'item';
      var when = s.daysUntil < 0 ? '<b>' + (-s.daysUntil) + 'd overdue</b>' : s.daysUntil === 0 ? '<b>due today</b>' : 'due in ' + s.daysUntil + 'd';
      div.innerHTML = '<span class="chip c-' + s.tier + '">' + LABEL[s.tier] + '</span>' +
        '<span class="info"><span class="nm">' + esc(it.name) + '</span><div class="meta">' +
        'with <b>' + esc(it.borrower) + '</b> since ' + it.lent + ' (' + s.daysOut + 'd out) &middot; due ' + s.due + ' &middot; ' + when +
        '</div></span>' +
        '<button class="back-btn" data-id="' + it.id + '">got it back</button>' +
        '<button class="del" data-id="' + it.id + '">&times;</button>';
      el.appendChild(div);
    });
    el.querySelectorAll('.back-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        items.forEach(function (i) { if (i.id === b.getAttribute('data-id')) i.returned = todayISO(); });
        save(); renderAll();
      });
    });
    el.querySelectorAll('.del').forEach(function (b) {
      b.addEventListener('click', function () {
        items = items.filter(function (i) { return i.id !== b.getAttribute('data-id'); });
        save(); renderAll();
      });
    });
  }

  function renderBorrowers() {
    var el = document.getElementById('borrowers');
    var names = [];
    items.forEach(function (i) { if (names.indexOf(i.borrower) === -1) names.push(i.borrower); });
    if (!names.length) { el.innerHTML = '<div class="empty">No borrowers yet.</div>'; return; }
    el.innerHTML = '';
    names.map(function (n) { return { name: n, bs: Lendmark.borrowerScore(n, items, todayISO()) }; })
      .sort(function (a, b) { return (a.bs.score === null ? 101 : a.bs.score) - (b.bs.score === null ? 101 : b.bs.score); })
      .forEach(function (x) {
        var div = document.createElement('div');
        div.className = 'borrower';
        var sc = x.bs.score === null ? '-' : x.bs.score;
        var color = x.bs.score === null ? 'var(--dim)' : x.bs.score >= 70 ? 'var(--ok)' : x.bs.score >= 40 ? 'var(--soon)' : 'var(--over)';
        var meta = [];
        if (x.bs.total) meta.push(x.bs.onTime + '% on time over ' + x.bs.total + ' returns');
        if (x.bs.outNow) meta.push(x.bs.outNow + ' out now' + (x.bs.overdueNow ? ' (' + x.bs.overdueNow + ' overdue)' : ''));
        if (!meta.length) meta.push('no history');
        div.innerHTML = '<span class="score" style="color:' + color + '">' + sc + '</span>' +
          '<span class="nm">' + esc(x.name) + '</span>' +
          '<span class="meta">' + meta.join(' &middot; ') + '</span>';
        el.appendChild(div);
      });
  }

  function renderAll() { renderItems(); renderBorrowers(); }

  document.getElementById('add').addEventListener('click', function () {
    var name = document.getElementById('i-name').value.trim();
    var borrower = document.getElementById('i-borrower').value.trim();
    var date = document.getElementById('i-date').value;
    if (!name || !borrower || !date) return;
    items.push({ id: 'i' + Date.now(), name: name, borrower: borrower, lent: date, expectedDays: +document.getElementById('i-days').value, returned: null });
    document.getElementById('i-name').value = '';
    document.getElementById('i-borrower').value = '';
    save(); renderAll();
  });

  // test hook
  window.__lm = {
    clear: function () { items = []; save(); renderAll(); },
    lend: function (name, borrower, lent, expectedDays) {
      items.push({ id: 'i' + Math.random(), name: name, borrower: borrower, lent: lent, expectedDays: expectedDays, returned: null });
      save(); renderAll();
    },
    gotBack: function (name, returnedISO) {
      items.forEach(function (i) { if (i.name === name) i.returned = returnedISO; });
      save(); renderAll();
    },
    read: function () {
      return {
        names: Array.prototype.map.call(document.querySelectorAll('#items .nm'), function (d) { return d.textContent; }),
        chips: Array.prototype.map.call(document.querySelectorAll('#items .chip'), function (d) { return d.textContent; }),
        borrowers: Array.prototype.map.call(document.querySelectorAll('#borrowers .borrower'), function (d) { return d.textContent; })
      };
    }
  };

  document.getElementById('i-date').value = todayISO();
  load();
  renderAll();
})();
</script>
</body>
</html>
